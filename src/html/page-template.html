    <!-- Function to set ENgrid data attributes on the body if not set in URL -->
    <script>

            const body = document.querySelector("body");
            const urlParams = new URLSearchParams(window.location.search);

            if (!urlParams.has("data-engrid-" + attributeName)) {
                body.setAttribute("data-engrid-" + attributeName, attributeValue);
            }
        }

<!-- If using a two column layout without content in the body-top OR body-main section, automatically change to a one column layout -->
<script>
    const checkForTwoColumnLayout = document.querySelector('body[data-engrid-layout="centercenter2col"]');
    const checkForBodyTopContent = document.querySelector('.body-top > *');
    const checkForBodyMainContent = document.querySelector('.body-main > *');
    if (checkForTwoColumnLayout && (!checkForBodyTopContent || !checkForBodyMainContent)) {
        document.querySelector("body").setAttribute("data-engrid-layout", "centercenter1col");
    }
</script>

<!-- Start Render Critical Javascript -->
<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        // 4Site's simplified image lazy loader
        var srcDefer = document.querySelectorAll("img[data-src]");
        for (var i = 0; i < srcDefer.length; i++) {
            let dataSrc = srcDefer[i].getAttribute("data-src");
            if (dataSrc) {
                srcDefer[i].setAttribute("decoding", "async"); // Gets image processing off the main working thread
                srcDefer[i].setAttribute("loading", "lazy"); // Lets the browser determine when the asset should be downloaded
                srcDefer[i].setAttribute("src", dataSrc); // Sets the src which will cause the browser to retrieve the asset
                srcDefer[i].setAttribute("data-engrid-data-src-processed", "true"); // Sets an attribute to mark that it has been processed by ENgrid
                srcDefer[i].removeAttribute("data-src"); // Removes the data-source
            }
        }
    });
</script>
<!-- End Render Critical Javascript -->
